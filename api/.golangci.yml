version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
  exclusions:
    rules:
      # Test code reads fixtures and uses the local compose credentials.
      - path: '(_test\.go|internal/dbtest/)'
        linters: [gosec]
formatters:
  enable:
    - gofmt
    - goimports
