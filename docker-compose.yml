services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: draftmind
      POSTGRES_PASSWORD: draftmind
      POSTGRES_DB: draftmind
    ports:
      - "127.0.0.1:${DB_PORT:-55433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U draftmind -d draftmind"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
